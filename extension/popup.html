<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow Login Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">F</div>
      <div>
        <h1>Connect Google Flow</h1>
        <p id="description">Usa as contas do Google que já estão logadas neste navegador.</p>
      </div>
      <div id="status" class="status" role="status">Procurando o Flow MCP…</div>
      <button id="connect" type="button" disabled>Connect Flow</button>
      <p class="privacy">Enviado só para o Flow MCP neste computador. Senhas e 2FA nunca são acessados.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
